services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: matrix
      POSTGRES_DB: matrix
      POSTGRES_PASSWORD: ${MATRIX_DB_LOCAL_PASSWORD:?Set MATRIX_DB_LOCAL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MATRIX_DB_LOCAL_PORT:-5432}:5432"
    volumes:
      - matrix_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d matrix"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  matrix_data:
